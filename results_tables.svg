<svg xmlns="http://www.w3.org/2000/svg" width="920" height="760" viewBox="0 0 920 760" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">

  <rect x="0" y="0" width="920" height="760" fill="#ffffff"/>

  <!-- Title -->
