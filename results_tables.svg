  <!-- notes -->
  <text x="40" y="700" font-size="11.5" fill="#546e7a">R-QUPID prediction: majority vote over 100 noisy copies of the input. White-box attacks on the whole test set.</text>
  <text x="40" y="718" font-size="11.5" fill="#546e7a">Random and transfer: 500 test samples; transfer = mean over the 3 classical surrogates, FGSM and PGD.</text>
  <text x="40" y="736" font-size="11.5" fill="#546e7a">S1 only: EoT with 30 draws 34.8% / MCC ≈ 0.</text>

</svg>
