    <text x="620" y="53" font-size="13" font-style="italic" fill="#546e7a" text-anchor="end">53.49%</text>
    <text x="750" y="53" font-size="13" font-style="italic" fill="#546e7a" text-anchor="end">50.90%</text>
    <text x="868" y="53" font-size="13" font-style="italic" fill="#546e7a" text-anchor="end">41.62%</text>

    <text x="52"  y="85" font-size="13" fill="#1a1a1a">FTTransformer</text>
    <text x="490" y="85" font-size="13" fill="#1a1a1a" text-anchor="end">94.73% / 0.913</text>
    <text x="620" y="85" font-size="13" fill="#1a1a1a" text-anchor="end">91.15% / 0.866</text>
    <text x="750" y="85" font-size="13" fill="#1a1a1a" text-anchor="end">91.70% / 0.877</text>
    <text x="868" y="85" font-size="13" fill="#1a1a1a" text-anchor="end">89.32% / 0.855</text>

    <text x="52"  y="117" font-size="13" fill="#1a1a1a">MTL-LSTM</text>
    <text x="490" y="117" font-size="13" fill="#1a1a1a" text-anchor="end">89.39% / 0.822</text>
    <text x="620" y="117" font-size="13" fill="#1a1a1a" text-anchor="end">83.78% / 0.755</text>
    <text x="750" y="117" font-size="13" fill="#1a1a1a" text-anchor="end">90.94% / 0.867</text>
    <text x="868" y="117" font-size="13" fill="#1a1a1a" text-anchor="end">89.11% / 0.851</text>

    <text x="52"  y="149" font-size="13" fill="#1a1a1a">QH-DNN</text>
    <text x="490" y="149" font-size="13" fill="#1a1a1a" text-anchor="end">75.69% / 0.568</text>
    <text x="620" y="149" font-size="13" fill="#1a1a1a" text-anchor="end">65.15% / 0.491</text>
    <text x="750" y="149" font-size="13" fill="#1a1a1a" text-anchor="end">69.36% / 0.585</text>
