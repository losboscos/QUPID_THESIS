  <!-- TABLE 2 -->
  <text x="40" y="360" font-size="14.5" font-weight="600" fill="#2c3e50">R-QUPID under attack</text>
  <text x="880" y="360" font-size="12" fill="#546e7a" text-anchor="end">accuracy / MCC</text>

  <g transform="translate(0,374)">
    <!-- header -->
    <rect x="40" y="0" width="840" height="32" fill="#eceff1"/>
    <text x="52"  y="21" font-size="13" font-weight="600" fill="#37474f">Attack</text>
    <text x="490" y="21" font-size="13" font-weight="600" fill="#37474f" text-anchor="end">S1</text>
    <text x="620" y="21" font-size="13" font-weight="600" fill="#37474f" text-anchor="end">S3</text>
    <text x="750" y="21" font-size="13" font-weight="600" fill="#37474f" text-anchor="end">S11</text>
    <text x="868" y="21" font-size="13" font-weight="600" fill="#37474f" text-anchor="end">S12</text>

    <!-- zebra -->
